name: Manual Build and Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'release-1.16.1-jp'
      release_name:
        description: 'Release name/tag'
        required: true
        default: 'v1.16.1-jp'
      target_boards:
        description: 'Build targets (comma-separated)'
        required: true
        default: 'px4_fmu-v5_default'
      create_release:
        description: 'Create GitHub release?'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            build-essential \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            make \
            python3-pip \
            python3-dev \
            rsync \
            unzip \
            zip
      
      - name: Install Python dependencies
        run: |
          pip3 install --user -U \
            empy \
            jinja2 \
            jsonschema \
            numpy \
            packaging \
            pyros-genmsg \
            pyulog \
            pyyaml \
            toml \
            wheel
      
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: px4-build-${{ github.event.inputs.branch }}
          max-size: 1G
      
      - name: Build PX4 firmware
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          
          # Split comma-separated targets
          IFS=',' read -ra TARGETS <<< "${{ github.event.inputs.target_boards }}"
          
          for target in "${TARGETS[@]}"; do
            # Trim whitespace
            target=$(echo "$target" | xargs)
            echo "================================"
            echo "Building: $target"
            echo "================================"
            make $target
          done
      
      - name: Prepare artifacts
        run: |
          mkdir -p release
          
          # Find and copy all build artifacts
          find build -name "*.px4" -exec cp {} release/ \; || true
          find build -name "*.bin" -exec cp {} release/ \; || true
          
          # List what we built
          echo "================================"
          echo "Built artifacts:"
          echo "================================"
          ls -lh release/ || echo "No artifacts found"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: px4-firmware-${{ github.event.inputs.release_name }}
          path: release/*
          retention-days: 30
          if-no-files-found: warn
      
      - name: Create Release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_name }}
          name: PX4 ${{ github.event.inputs.release_name }}
          draft: false
          prerelease: false
          files: release/*
          body: |
            ## 🚁 PX4 Autopilot Custom Build
            
            **Branch:** `${{ github.event.inputs.branch }}`  
            **Build targets:** `${{ github.event.inputs.target_boards }}`  
            **Build date:** ${{ github.event.repository.updated_at }}
            
            ### 📦 Installation
            1. Download the appropriate `.px4` file for your flight controller
            2. Open QGroundControl
            3. Flash the firmware using the custom firmware option
            
            ### 🔧 Build Information
            - Workflow run: [${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
