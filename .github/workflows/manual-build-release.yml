name: Manual Build and Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'release-1.16.1-jp'
      release_name:
        description: 'Release name/tag'
        required: true
        default: 'v1.16.1-jp'
      target_boards:
        description: 'Build targets (comma-separated)'
        required: true
        default: 'px4_fmu-v5_default,px4_fmu-v6x_default'
      create_release:
        description: 'Create GitHub release?'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            exiftool \
            astyle \
            build-essential \
            ccache \
            cmake \
            cppcheck \
            file \
            g++ \
            gcc \
            gdb \
            git \
            lcov \
            make \
            ninja-build \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            rsync \
            shellcheck \
            unzip \
            xsltproc \
            zip
          
          # Install Python packages
          pip3 install --user -U \
            empy \
            jinja2 \
            jsonschema \
            numpy \
            packaging \
            pyros-genmsg \
            pyulog \
            pyyaml \
            toml \
            cerberus
      
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: px4-build-${{ github.event.inputs.branch }}
      
      - name: Build PX4 firmware
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR=$HOME/.ccache
          
          IFS=',' read -ra TARGETS <<< "${{ github.event.inputs.target_boards }}"
          
          for target in "${TARGETS[@]}"; do
            echo "Building $target..."
            make $target
          done
      
      - name: Prepare artifacts
        run: |
          mkdir -p release
          find build -name "*.px4" -exec cp {} release/ \;
          find build -name "*.bin" -exec cp {} release/ \;
          find build -name "*.elf" -exec cp {} release/ \;
          
          # List created files
          echo "Built files:"
          ls -lh release/
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: px4-firmware-${{ github.event.inputs.release_name }}
          path: release/*
          retention-days: 30
      
      - name: Create Release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_name }}
          name: PX4 ${{ github.event.inputs.release_name }}
          draft: false
          prerelease: false
          files: release/*
          body: |
            ## PX4 Autopilot Custom Build
            
            **Branch:** ${{ github.event.inputs.branch }}
            **Build targets:** ${{ github.event.inputs.target_boards }}
            **Built on:** ${{ github.run_id }}
            **Date:** ${{ github.event.repository.updated_at }}
            
            ### Installation
            Download the appropriate `.px4` file for your flight controller and flash it using QGroundControl.
            
            ### Build Information
            - Workflow: ${{ github.workflow }}
            - Run: ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
